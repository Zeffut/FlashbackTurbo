plugins {
    id 'fabric-loom' version '1.16.2'
    id 'com.gradleup.shadow' version '9.2.2'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Minecraft 26.2 and its Fabric API are already Mojang-named. Avoid asking
// Loom for unavailable official mapping metadata for this stable line.
loom {
    noIntermediateMappings()
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Loom still requires a mappings dependency when intermediate mappings are
    // disabled. This empty official -> named mapping declares the identity path.
    def stubMappingsJar = file("${buildDir}/stub-mappings.jar")
    if (!stubMappingsJar.exists()) {
        stubMappingsJar.parentFile.mkdirs()
        def tinyContent = "tiny\t2\t0\tofficial\tnamed\n"
        new java.util.jar.JarOutputStream(stubMappingsJar.newOutputStream()).withCloseable { jos ->
            def entry = new java.util.jar.JarEntry("mappings/mappings.tiny")
            jos.putNextEntry(entry)
            jos.write(tinyContent.bytes)
            jos.closeEntry()
        }
    }
    mappings files(stubMappingsJar)
    // With official Mojang mappings for 26.x, keep Fabric jars on the compile
    // classpath without asking Loom to remap their intermediary access wideners.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Flashback is compile-only: the user supplies the runtime Flashback jar.
    def flashbackJar = file("libs/${project.flashback_jar}")
    if (flashbackJar.exists()) {
        compileOnly files(flashbackJar)
        modLocalRuntime files(flashbackJar)
    } else {
        logger.warn("[FlashbackTurbo] libs/${project.flashback_jar} missing — run scripts/fetch-flashback.sh before build.")
    }

    // Compile annotation support for Mixin and @WrapOperation; Fabric Loader supplies them at runtime.
    compileOnly "net.fabricmc:sponge-mixin:0.16.3+mixin.0.8.7"
    compileOnly "io.github.llamalad7:mixinextras-common:0.5.4"

    // Telemetry — shaded + relocated (see shadowJar) to avoid classloader conflicts.
    implementation "com.posthog.java:posthog:1.1.1"

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

test {
    useJUnitPlatform()
}

jar {
    // Keep the plain compiled jar as a development artifact. Minecraft 26.2 / this
    // port runs with official Mojang names at runtime, so the distributable must
    // not be Loom-remapped to intermediary names like net/minecraft/class_310.
    archiveClassifier = 'dev'
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// PostHog SDK is shaded + relocated so the final jar is self-contained without leaking deps.
// This is the runtime jar users should install. It intentionally stays in official
// Mojang names for Minecraft 26.2; remapping it would recreate the class_310 crash.
shadowJar {
    configurations = [project.configurations.runtimeClasspath]
    dependencies {
        include(dependency('com.posthog.java:posthog'))
    }
    relocate 'com.posthog', 'fr.zeffut.flashbackturbo.shadow.posthog'
    archiveClassifier = ''
}

// Do not publish Loom's intermediary-remapped jar for this 26.2 port. The current
// 26.2 runtime and Flashback jars use official names, so an intermediary jar fails
// during client entrypoint loading before the window opens.
remapJar {
    enabled = false
}

assemble.dependsOn shadowJar

tasks.register('verifyRuntimeJarNames') {
    dependsOn shadowJar
    group = 'verification'
    description = 'Fails if the installable jar contains intermediary net/minecraft/class_* references.'
    doLast {
        def jarFile = shadowJar.archiveFile.get().asFile
        def matchingEntries = []
        zipTree(jarFile).matching { include '**/*.class' }.visit { entry ->
            if (!entry.directory && entry.file.bytes.contains('net/minecraft/class_'.bytes)) {
                matchingEntries << entry.relativePath.pathString
            }
        }
        if (!matchingEntries.isEmpty()) {
            throw new GradleException("${jarFile.name} still contains intermediary Minecraft class references: ${matchingEntries.take(10)}")
        }
    }
}

check.dependsOn tasks.named('verifyRuntimeJarNames')

name: Gradle CI

on:
  pull_request:
  push:
    branches:
      - main
      - port/26.2

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch pinned Flashback dependency
        run: ./scripts/fetch-flashback.sh
      - name: Clean build, tests, and headless runtime smoke
        run: ./gradlew --no-daemon clean test headlessSmoke
      - name: Record installable archive metadata
        run: |
          sha256sum build/libs/flashbackturbo-*.jar
          unzip -p build/libs/flashbackturbo-*.jar META-INF/MANIFEST.MF
          unzip -p build/libs/flashbackturbo-*.jar fabric.mod.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flashbackturbo-26.2-verification
          path: |
            build/libs/*.jar
            build/reports/tests/test/
          if-no-files-found: warn